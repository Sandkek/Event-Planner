<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Админ-панель — Соберёмся</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/base.css">
</head>
<body>
  <div class="container py-4">
    <h1 class="mb-4">Админ-панель</h1>

    <div class="row g-3 mb-4" id="statsContainer"></div>

    <h3>Мероприятия</h3>
    <div class="table-responsive mb-5">
      <table class="table table-bordered align-middle">
        <thead>
            <tr>
                <th>ID</th>
                <th>Название</th>
                <th>Дата</th>
                <th>Организатор</th>
                <th>Участников</th>
                <th>Статус</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody id="eventsTableBody"></tbody>
      </table>
    </div>

    <h3>Пользователи</h3>
    <div class="table-responsive">
      <table class="table table-bordered align-middle">
        <thead>
            <tr>
                <th>ID</th>
                <th>Имя</th>
                <th>Email</th>
                <th>Роль</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody id="usersTableBody"></tbody>
      </table>
    </div>
  </div>

  <script type="module" src="/static/js/pages/admin.js"></script>
</body>
</html>
